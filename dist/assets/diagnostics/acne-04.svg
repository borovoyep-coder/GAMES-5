<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 4. Получить посев при осложнённом процессе: Остиофолликулит и акне</title><desc id="description">При глубокой инфекции, рецидиве или неэффективности обоснованной терапии взять репрезентативный материал для бактериологического посева и чувствительности. Отбор выполняет специалист до смены антибиотика, когда возможно; поверхностное отделяемое свища не всегда представляет микрофлору глубоко расположенного поражения. Получен результат посева, сопоставленный с цитологией и местом отбора; рост случайной поверхностной флоры не объявлен автоматически причиной глубокого процесса.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="culture" viewBox="0 0 400 260"><title>Бактериологический посев и исследование чувствительности</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><ellipse cx="130" cy="167" rx="77" ry="36" fill="#E7EAC9" stroke="#8CA68E" stroke-width="2.3" /><path d="M53 167 V181 A77 36 0 0 0 207 181V167" fill="#E9EFDF" stroke="#8CA68E" stroke-width="2" /><ellipse cx="130" cy="159" rx="77" ry="36" fill="#EBEED6" fill-opacity=".72" stroke="#8CA68E" stroke-width="2.2" /><circle cx="95" cy="151" r="5" fill="#C1BE82" stroke="#9F9D6E" stroke-width="0.7" /><circle cx="125" cy="144" r="7" fill="#C1BE82" stroke="#9F9D6E" stroke-width="0.7" /><circle cx="152" cy="166" r="5" fill="#C1BE82" stroke="#9F9D6E" stroke-width="0.7" /><circle cx="175" cy="154" r="4" fill="#C1BE82" stroke="#9F9D6E" stroke-width="0.7" /><circle cx="116" cy="172" r="4" fill="#C1BE82" stroke="#9F9D6E" stroke-width="0.7" /><circle cx="140" cy="158" r="3" fill="#C1BE82" stroke="#9F9D6E" stroke-width="0.7" /><g transform="translate(273 90) scale(1.1)"><path d="M0 0 H24 V79 Q12 98 0 79Z" fill="#F1F7F0" stroke="#86A596" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M2 45 H22 V77 Q12 91 2 77Z" fill="#E8EEDC" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-2" y="-7" width="28" height="17" rx="3" fill="#B7CFD9" stroke="#315C50" stroke-width="1.5" /><rect x="3" y="18" width="18" height="21" rx="2" fill="#FFFDF5" stroke="none" stroke-width="2" /><path d="M6 23H18 M6 29H15" fill="none" stroke="#AAB6A8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M285 137V177" fill="none" stroke="#879D8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="285" cy="177" r="4" fill="#FAF8F0" stroke="#315C50" stroke-width="1" /><rect x="55" y="227" width="160" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="63" y="242" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Посев и чувствительность</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">04 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Получить посев при осложнённом процессе</text><use href="#culture" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Остиофолликулит и акне</text></svg>