<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 4. Согласовать клинику и морфологию: Доброкачественные новообразования</title><desc id="description">Врач проверяет соответствие заключения поведению узла: скорости роста, изъязвлению и локализации. Отличает вирусную папиллому от аденомы и гиперплазии сальных желёз, а воспаление — от опухоли. При противоречиях обсуждает пересмотр материала с патологом вместо автоматического принятия удобного объяснения. Доброкачественный диагноз обоснован согласованными данными либо выявлена остающаяся неопределённость; сформулировано, что именно подтверждено и какой вопрос требует дополнительного исследования ткани.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="microscope" viewBox="0 0 400 260"><title>Исследование образца под микроскопом</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(88 51) scale(1.02)"><path d="M13 142 H129 Q139 149 135 157 H5 Q0 148 13 142Z" fill="#7EA792" stroke="#315C50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M51 140 C91 117 97 69 67 36 L85 23 C133 77 114 133 88 144" fill="#DCE8DD" stroke="#315C50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M58 14 88 0 101 27 71 41Z" fill="#7EA792" stroke="#315C50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 8 73-5 78 7 54 19Z" fill="#315C50" stroke="#315C50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M52 43 74 32 84 