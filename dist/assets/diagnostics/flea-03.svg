<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 3. Выполнить вычёсывание: Блошиный аллергический дерматит</title><desc id="description">Врач или обученный сотрудник клиники проводит частым гребнем по шерсти, особенно в типичных зонах, и исследует собранный материал. Подозрительные тёмные крупинки помещает на влажную белую бумагу: красно-коричневое окрашивание поддерживает наличие переваренной крови в блошиных экскрементах, а не обычной грязи. Положительная находка усиливает диагноз при совместимой клинике. Отрицательное вычёсывание не исключает БАД и не доказывает поведенческую причину самоиндуцированной алопеции.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="flea-comb" viewBox="0 0 400 260"><title>Вычесывание блох и исследование блошиной грязи</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(43 135)"><path d="M0 0 Q35.6 -7 71.2 0 T142.4 0 L178 0 V55 H0Z" fill="#F2D9C7" stroke="#B28B70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 0 Q35.6 -7 71.2 0 T142.4 0 L178 0 V13 H0Z" fill="#D9A687" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 18 H178" fill="none" stroke="#E4BAA0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M57 137q-8-25-4-36" fill="none" stroke="#A68157" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M65 137q-8-25-4-36" fill="none" stroke="#A68157" stroke-width="1.7" stroke-linecap="round"