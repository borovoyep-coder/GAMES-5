<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 2. Исследовать оставшиеся волосы: Алопеция</title><desc id="description">Осмотреть волосы с увеличением и при необходимости выполнить трихограмму: оценить кончики, стержни и корни. Искать обламывание, дефекты структуры и признаки поражения волос. Результат сопоставить с локализацией, уходом и возможной механической травмой, а не трактовать отдельно. Механизм потери шерсти становится понятнее: вероятно обламывание, нарушение формирования волоса либо выпадение без очевидной травмы по исследованным образцам данного пациента.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="hair" viewBox="0 0 400 260"><title>Микроскопическое исследование волос</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><rect x="50" y="152" width="128" height="42" rx="3" fill="#E6F0E7" stroke="#97B29E" stroke-width="1.8" /><path d="M63 177Q103 157 148 175" fill="none" stroke="#A68157" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 185Q108 160 159 171" fill="none" stroke="#A68157" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M68 169Q110 183 160 169" fill="none" stroke="#A68157" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="285" cy="114" r="66" fill="#F1EDDB" stroke="#A1B49B" stroke-width="2.2" /><path d="M247 78 Q275 107 314 147" fill="none" stroke="#A68157" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /><path d="M247 78 Q275 107 314 147" fill="none" stroke="#D1B384" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M250 94l12-10" fill="none" stroke="#9B7B50" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M261 106l12-10" fill="none" stroke="#9B7B50" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M272 119l12-10" fill="none" stroke="#9B7B50" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M284 132l12-10" fill="none" stroke="#9B7B50" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M296 145l12-10" fill="none" stroke="#9B7B50" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M177 169 216 144" fill="none" stroke="#A6BDA7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" /><path d="M73 66 97 125 112 121 98 60 M97 125 105 141" fill="none" stroke="#83A397" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="53" y="225" width="184" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="61" y="240" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Трихограмма: корни и стержни</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">02 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Исследовать оставшиеся волосы</text><use href="#hair" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Алопеция</text></svg>