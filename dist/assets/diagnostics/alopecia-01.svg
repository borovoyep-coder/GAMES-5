<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 1. Уточнить начало и распределение: Алопеция</title><desc id="description">Спросить, был ли зуд до облысения, замечено ли вылизывание, были ли стрижка, тяжёлая болезнь или новые лекарства. Осмотреть всё животное и отметить симметрию, воспаление, очаги разной давности, состояние ушей, когтей и оставшейся шерсти. Описан клинический тип алопеции, выявлены признаки воспаления или системной болезни и сформированы основные группы причин для дальнейшей проверки у пациента.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="history" viewBox="0 0 400 260"><title>Сбор анамнеза</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(57 51) scale(1.03)"><rect x="0" y="0" width="116" height="154" rx="9" fill="#FEFDF8" stroke="#AABCB0" stroke-width="2" /><rect x="34" y="-6" width="48" height="17" rx="5" fill="#7EA792" stroke="#315C50" stroke-width="2" /><circle cx="58" cy="-2" r="3" fill="#FAF8F0" stroke="none" stroke-width="2" /><path d="M20 38H93 M20 67H93 M20 96H93 M20 125H93" fill="none" stroke="#C4D2C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="m19 29 4 4 8-9 m-12 34 4 4 8-9 m-12 34 4 4 8-9" fill="none" stroke="#7EA792" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(266 89) scale(0.84)"><path d="M-40 91 C-49 67-47 36-23 18 C-6-1 34 0 49 25 C65 44 68 72 58 94 L44 129 H-16Z" fill="#EACFA7" stroke="#A68157" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-28 22 C-56 14-62 37-58 66 C-55 85-35 88-26 67Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M38 18 C60 18 73 34 69 61 C68 77 55 80 48 65Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 57 C-25 57-26 80-10 89 C9 96 37 91 41 72 C40 58 26 53 14 55Z" fill="#F3DEBB" stroke="#A68157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 63 Q10 57 20 63 L13 72 H6Z" fill="#315C50" stroke="#315C50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-13" cy="44" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><circle cx="34" cy="43" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><path d="M10 72 V80 M-1 81 Q10 88 22 80" fill="none" stroke="#315C50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-24 103 Q7 115 43 102" fill="none" stroke="#C6A477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M205 45 Q255 12 314 40 V77 Q291 94 266 80 L246 91 249 76 H226 Q205 73 205 45Z" fill="#E3EBDE" stroke="#A5BAA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="226" y="53" fill="#315C50" font-family="Arial,sans-serif" font-size="13" font-weight="500">Анамнез</text><path d="M225 64 H288" fill="none" stroke="#A3B6A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="221" width="106" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="68" y="236" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Когда началось?</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">01 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Уточнить начало и распределение</text><use href="#history" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Алопеция</text></svg>