<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 4. Исключить вероятный агент: Контактный дерматит</title><desc id="description">Врач и владелец согласуют замену или прекращение подозрительного контакта, фиксируют исходные фотографии и критерии ответа. Изменения вводят последовательно, насколько это возможно, а необходимое симптоматическое ведение записывают отдельно. Диагностический период и контроль определяют с учётом тяжести и сохранения вещества в среде. Если очаги уменьшаются при устойчивом исключении агента, контактный механизм вероятнее. Если изменений нет, проверяют скрытые контакты, достаточность наблюдения и дифференциальные диагнозы.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="elimination" viewBox="0 0 400 260"><title>Элиминационная диета с дневником наблюдений</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><path d="M51 177 H167 L155 207 Q109.0 219 63 207Z" fill="#DCE8DD" stroke="#315C50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="109.0" cy="177" rx="58.0" ry="11" fill="#CFB086" stroke="#315C50" stroke-width="2" /><g transform="translate(326 140) scale(0.65)"><path d="M-40 8 -38-30 -12-11 Q7-18 26-8 L49-29 50 11 Q64 38 49 63 Q6 89-35 65 C-55 48-56 27-40 8Z" fill="#E6E8DB" stroke="#82917B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-31-16 -29 5 -17-7 M32-5 42-17 43 5" fill="#F2D9C7" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-26 25 Q-15 17-5 24 M18 24 Q29 16 40 24" fill="none" stroke="#315C50" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="m2 39 9-1-4 7Z" fill="#C7806A" stroke="#C7806A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M7 46 V53 M-3 54 Q7 60 17 53 M-12 42-39 38 M-11 49-43 52 M24 42 53 37 M24 49 58 51" fill="none" stroke="#78907C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(213 49) scale(0.67)"><rect x="0" y="0" width="116" height="154" rx="9" fill="#FEFDF8" stroke="#AABCB0" stroke-width="2" /><rect x="34" y="-6" width="48" height="17" rx="5" fill="#7EA792" stroke="#315C50" stroke-width="2" /><circle cx="58" cy="-2" r="3" fill="#FAF8F0" stroke="none" stroke-width="2" /><path d="M20 38H93 M20 67H93 M20 96H93 M20 125H93" fill="none" stroke="#C4D2C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="m19 29 4 4 8-9 m-12 34 4 4 8-9 m-12 34 4 4 8-9" fill="none" stroke="#7EA792" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="76" cy="175" r="4.3" fill="#9F8057" stroke="none" stroke-width="2" /><circle cx="99" cy="170" r="4.3" fill="#9F8057" stroke="none" stroke-width="2" /><circle cx="123" cy="174" r="4.3" fill="#9F8057" stroke="none" stroke-width="2" /><circle cx="142" cy="177" r="4.3" fill="#9F8057" stroke="none" stroke-width="2" /><circle cx="109" cy="182" r="4.3" fill="#9F8057" stroke="none" stroke-width="2" /><circle cx="87" cy="181" r="4.3" fill="#9F8057" stroke="none" stroke-width="2" /><path d="M86 75 H138 Q148 75 148 90V145H75V90Q75 75 86 75Z" fill="#DCE8DD" stroke="#315C50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="79" y="68" width="64" height="16" rx="4" fill="#7EA792" stroke="#315C50" stroke-width="1.6" /><circle cx="111" cy="111" r="16" fill="#FAF8F0" stroke="#A7BDA8" stroke-width="1.5" /><path d="M100 111H122 M111 100V122" fill="none" stroke="#7EA792" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="62" y="226" width="178" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="70" y="241" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Диетическая проба и дневник</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">04 / 06</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Исключить вероятный агент</text><use href="#elimination" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Контактный дерматит</text></svg>