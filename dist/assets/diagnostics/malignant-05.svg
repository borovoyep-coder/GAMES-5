<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 5. Выбрать типоспецифичное стадирование: Злокачественные опухоли кожи</title><desc id="description">Онколог определяет необходимость исследований грудной клетки, брюшной полости и других органов исходя из типа опухоли, её степени, локализации и симптомов. При мастоцитоме и плоскоклеточном раке маршруты могут различаться. Не назначает одинаковое тотальное обследование каждому небольшому узлу независимо от диагноза. Сформулирована стадия в пределах проведённых исследований и указаны ограничения; обследование даёт информацию, которая действительно способна повлиять на клиническое решение пациента.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="imaging" viewBox="0 0 400 260"><title>Визуальная диагностика по клиническим показаниям</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><rect x="146" y="43" width="206" height="140" rx="8" fill="#B8CCBD" stroke="#315C50" stroke-width="2.4" /><rect x="153" y="50" width="192" height="119" rx="4" fill="#4A685C" stroke="none" stroke-width="2" /><path d="M249.0 183V212 M207.8 212H290.2" fill="none" stroke="#315C50" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M177 107 Q194 79 230 90 L278 98 303 82 316 95 304 115 288 117 282 147H269L267 121H214L209 147H196L196 119 177 119Z" fill="#BFD1BB" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M207 104H280 M215 99V113 M229 100V114 M243 101V114 M257 101V115" fill="none" stroke="#789480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M177 109Q162 103 164 90" fill="none" stroke="#BFD1BB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="47" y="224" width="148" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="55" y="239" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Визуальная диагностика</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">05 / 06</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Выбрать типоспецифичное стадирование</text><use href="#imaging" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Злокачественные опухоли кожи</text></svg>