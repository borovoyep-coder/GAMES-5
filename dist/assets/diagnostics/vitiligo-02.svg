<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 2. Сравнить цвет и структуру: Витилиго</title><desc id="description">Врач осматривает носовое зеркало, губы, слизистые, кожу и шерсть, оценивая симметрию пятен и сохранность рельефа. Фиксирует эрозии, корки, уплотнения, болезненность и выпадение волос. При подозрительных изменениях глаз не ограничивается дерматологическим осмотром и организует профильную оценку. Описано, сохраняется ли нормальная архитектура кожи; выявлены признаки, поддерживающие витилиго, либо находки, требующие исключения волчанки, инфекции или другого воспалительного процесса.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="exam" viewBox="0 0 400 260"><title>Клинический осмотр животного</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(178 70) scale(1.1)"><path d="M-40 91 C-49 67-47 36-23 18 C-6-1 34 0 49 25 C65 44 68 72 58 94 L44 129 H-16Z" fill="#EACFA7" stroke="#A68157" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-28 22 C-56 14-62 37-58 66 C-55 85-35 88-26 67Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M38 18 C60 18 73 34 69 61 C68 77 55 80 48 65Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 57 C-25 57-26 80-10 89 C9 96 37 91 41 72 C40 58 26 53 14 55Z" fill="#F3DEBB" stroke="#A68157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 63 Q10 57 20 63 L13 72 H6Z" fill="#315C50" stroke="#315C50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-13" cy="44" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><circle cx="34" cy="43" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><path d="M10 72 V80 M-1 81 Q10 88 22 80" fill="none" stroke="#315C50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-24 103 Q7 115 43 102" fill="none" stroke="#C6A477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(281 91) rotate(-58) scale(0.8)"><path d="M-35 41 -18 18 C-20 5-14-8-7-6 L-4 11 C2 1 5-13 11-10 L14 8 C19-2 24-9 29-5 L27 14 C37 10 41 15 37 22 L19 49Z" fill="#DDE7DF" stroke="#8DADA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-33 40 -47 62 -10 80 20 48" fill="#B7CFD9" stroke="#83A6B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M78 95 Q30 145 87 172 Q140 189 140 146" fill="none" stroke="#71958A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="140" cy="143" r="11" fill="#DCE8DD" stroke="#315C50" stroke-width="2" /><path d="M79 95V76 M65 94V78" fill="none" stroke="#315C50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="231" y="214" width="136" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="239" y="229" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Осмотр кожи и шерсти</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">02 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Сравнить цвет и структуру</text><use href="#exam" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Витилиго</text></svg>