<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 4. Исследовать стойкие подозрительные изменения: Актинический дерматит</title><desc id="description">При незаживающей язве, узле, выраженном кератозе или нетипичном течении ветеринарный врач планирует репрезентативную биопсию. При разных типах поражений может потребоваться отдельное исследование нескольких очагов. Гистологу сообщают солнечный анамнез, локализацию и клиническое подозрение на предопухолевые либо опухолевые изменения. Получено морфологическое заключение о солнечном повреждении и возможной неоплазии; результат сопоставлен с конкретным очагом, не автоматически со всеми изменениями кожи.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="biopsy" viewBox="0 0 400 260"><title>Панч-биопсия кожи и образец для гистологии</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(44 152)"><path d="M0 0 Q39.6 -7 79.2 0 T158.4 0 L198 0 V58 H0Z" fill="#F2D9C7" stroke="#B28B70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 0 Q39.6 -7 79.2 0 T158.4 0 L198 0 V13 H0Z" fill="#D9A687" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 18 H198" fill="none" stroke="#E4BAA0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="124" y="55" width="38" height="85" rx="8" fill="#CDDCD1" stroke="#315C50" stroke-width="2.4" /><rect x="119" y="43" width="48" height="17" rx="6" fill="#7EA792" stroke="#315C50" stroke-width="2" /><path d="M132 139V159 Q143 168 154 159V139" fill="#F3F5EA" stroke="#8B9D8D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 76 H161 M125 83 H161 M125 90 H161" fill="none" stroke="#9FB4A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="281" y="133" width="60" height="70" rx="6" fill="#E8F0E5" stroke="#8FA994" stroke-width="1.8" /><rect x="277" y="124" width="68" height="14" rx="4" fill="#7EA792" stroke="#315C50" stroke-width="1.7" /><rect x="286" y="155" width="50" height="25" rx="3" fill="#FAF8F0" stroke="none" stroke-width="2" /><text x="291" y="172" fill="#315C50" font-family="Arial,sans-serif" font-size="9" font-weight="500">Биоптат</text><path d="M300 183 Q308 172 317 183V193H300Z" fill="#F2D9C7" stroke="#BA9074" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="222" width="184" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="56" y="237" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Гистологическое исследование</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">04 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Исследовать стойкие подозрительные изменения</text><use href="#biopsy" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Актинический дерматит</text></svg>