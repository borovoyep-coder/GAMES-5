<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 7. Тестировать аллергены по показаниям: Атопический дерматит</title><desc id="description">Если после клинической диагностики планируют аллергенспецифическую иммунотерапию, дерматолог выбирает внутрикожное исследование или сывороточный специфический IgE. Подготовку и влияние лекарств определяет специалист. Результаты сопоставляют с реальными контактами, местом проживания и сезонностью, выбирая клинически значимые аллергены, а не весь положительный список. Результат пригоден для подбора релевантных аллергенов, если соответствует анамнезу. Расхождение с клинической картиной требует осторожной интерпретации и обсуждения со специалистом.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="allergy-test" viewBox="0 0 400 260"><title>Аллергологическое обследование по показаниям</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><path d="M42 161 Q58 112 125 121 T220 141 L235 209H66Z" fill="#EACFA7" stroke="#A68157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="99" y="135" width="99" height="52" rx="15" fill="#F3DECD" stroke="#B9997E" stroke-width="1.5" /><circle cx="118" cy="151" r="5" fill="#E5B4A0" stroke="#B98875" stroke-width="1.5" /><circle cx="118" cy="173" r="5" fill="#E5B4A0" stroke="#B98875" stroke-width="1.5" /><circle cx="147" cy="151" r="5" fill="#E5B4A0" stroke="#B98875" stroke-width="1.5" /><circle cx="147" cy="173" r="5" fill="#E5B4A0" stroke="#B98875" stroke-width="1.5" /><circle cx="176" cy="151" r="5" fill="#E5B4A0" stroke="#B98875" stroke-width="1.5" /><circle cx="176" cy="173" r="5" fill="#E5B4A0" stroke="#B98875" stroke-width="1.5" /><g transform="translate(270 58) scale(0.65)"><rect x="0" y="0" width="116" height="154" rx="9" fill="#FEFDF8" stroke="#AABCB0" stroke-width="2" /><rect x="34" y="-6" width="48" height="17" rx="5" fill="#7EA792" stroke="#315C50" stroke-width="2" /><circle cx="58" cy="-2" r="3" fill="#FAF8F0" stroke="none" stroke-width="2" /><path d="M20 38H93 M20 67H93 M20 96H93 M20 125H93" fill="none" stroke="#C4D2C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="m19 29 4 4 8-9 m-12 34 4 4 8-9 m-12 34 4 4 8-9" fill="none" stroke="#7EA792" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(209 81) rotate(-32) scale(0.63)"><path d="M-35 41 -18 18 C-20 5-14-8-7-6 L-4 11 C2 1 5-13 11-10 L14 8 C19-2 24-9 29-5 L27 14 C37 10 41 15 37 22 L19 49Z" fill="#DDE7DF" stroke="#8DADA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-33 40 -47 62 -10 80 20 48" fill="#B7CFD9" stroke="#83A6B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="39" y="227" width="172" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="47" y="242" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Аллерготесты по показаниям</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">07 / 07</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Тестировать аллергены по показаниям</text><use href="#allergy-test" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Атопический дерматит</text></svg>