 font-weight="600" fill="#617b50">04 / 06</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Подтвердить стойкость у стабильной кошки</text><use href="#cat-monitor" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Сахарный диабет</text></svg>