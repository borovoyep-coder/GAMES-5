<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 4. Подтвердить стойкость у стабильной кошки: Сахарный диабет</title><desc id="description">По согласованному плану использовать повторную гликемию в спокойной домашней обстановке, непрерывный мониторинг или повторную оценку глюкозурии. Альтернатива или дополнение — фруктозамин. Метод выбирают по доступности, переносимости процедур и вероятности болезни, не откладывая помощь клинически больному пациенту. Зафиксировано устойчивое повышение глюкозы или её нормализация вне стресса; фруктозамин даёт дополнительную оценку предшествующей гликемии, а не моментального значения.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="cat-monitor" viewBox="0 0 400 260"><title>Оценка стойкости гипергликемии у стабильной кошки</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(56 48) scale(0.98)"><rect x="0" y="0" width="116" height="154" rx="9" fill="#FEFDF8" stroke="#AABCB0" stroke-width="2" /><rect x="34" y="-6" width="48" height="17" rx="5" fill="#7EA792" stroke="#315C50" stroke-width="2" /><circle cx="58" cy="-2" r="3" fill="#FAF8F0" stroke="none" stroke-width="2" /><path d="M20 38H93 M20 67H93 M20 96H93 M20 125H93" fill="none" stroke="#C4D2C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="m19 29 4 4 8-9 m-12 34 4 4 8-9 m-12 34 4 4 8-9" fill="none" stroke="#7EA792" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(284 153) scale(0.68)"><pat