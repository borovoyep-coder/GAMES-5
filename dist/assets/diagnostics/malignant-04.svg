<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 4. Оценить местную и регионарную распространённость: Злокачественные опухоли кожи</title><desc id="description">Врач оценивает глубину, подвижность и связь опухоли с окружающими структурами; визуализацию выбирает при подозрении на глубокую или костную инвазию. Регионарные, а при необходимости сторожевые лимфоузлы исследует по онкологическим показаниям, учитывая, что пальпация не определяет наличие метастазов надёжно. Описаны местное распространение и состояние значимых лимфоузлов; при взятии образцов получено морфологическое подтверждение либо отсутствие обнаруженных опухолевых клеток в материале.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="palpation" viewBox="0 0 400 260"><title>Пальпация кожного образования и окружающих тканей</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(66 152)"><path d="M0 0 Q52.6 -7 105.2 0 T210.4 0 L263 0 V60 H0Z" fill="#F2D9C7" stroke="#B28B70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 0 Q52.6 -7 105.2 0 T210.4 0 L263 0 V13 H0Z" fill="#D9A687" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 18 H263" fill="none" stroke="#E4BAA0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M116 151 Q150 98 187 150" fill="#EACFA7" stroke="#B28B70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(117 83) rotate(-26) scale(0.88)"><path d="M-35 41 -18 18 C-20 5-14-8-7-6 L-4 11 C2 1 5-13 11-10 L14 8 C19-2 24-9 29-5 L27 14 C37 10 41 15 37 22 L19 49Z" fill="#DDE7DF" stroke="#8DADA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-33 40 -47 62 -10 80 20 48" fill="#B7CFD9" stroke="#83A6B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(278 118) rotate(66) scale(0.82)"><path d="M-35 41 -18 18 C-20 5-14-8-7-6 L-4 11 C2 1 5-13 11-10 L14 8 C19-2 24-9 29-5 L27 14 C37 10 41 15 37 22 L19 49Z" fill="#DDE7DF" stroke="#8DADA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-33 40 -47 62 -10 80 20 48" fill="#B7CFD9" stroke="#83A6B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M160 149Q168 141 175 150" fill="none" stroke="#B78D71" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="70" y="227" width="112" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="78" y="242" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Пальпация тканей</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">04 / 06</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Оценить местную и регионарную распространённость</text><use href="#palpation" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Злокачественные опухоли кожи</text></svg>