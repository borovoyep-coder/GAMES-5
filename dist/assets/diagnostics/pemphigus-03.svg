<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 3. Исследовать содержимое пустулы: Листовидная пузырчатка</title><desc id="description">Специалист получает цитологический материал из свежей пустулы или влажной поверхности под недавно сформировавшейся коркой, до местной антисептической обработки. Оценивает акантолитические кератиноциты, воспалительные клетки и микроорганизмы. Для исследования используют выбранный элемент, сохраняя другие подходящие поражения неповреждёнными до биопсии. Определено, присутствуют ли акантолиз и признаки инфекции; сформулировано предварительное заключение без объявления окончательного аутоиммунного диагноза только по одному препарату.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="cytology" viewBox="0 0 400 260"><title>Цитологическое исследование</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(53 158) rotate(-20)"><rect x="0" y="0" width="113" height="39" rx="3" fill="#E6F0EC" stroke="#8DAFA1" stroke-width="2" /><rect x="1" y="1" width="27" height="37" rx="2" fill="#F9F8F0" stroke="none" stroke-width="2" /><path d="M7 9H20 M7 16H20" fill="none" stroke="#C2CBBB" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="65" cy="20" r="9" fill="#D9B5BB" stroke="none" stroke-width="2" /><circle cx="79" cy="22" r="5" fill="#E1C8CD" stroke="none" stroke-width="2" /></g><circle cx="276" cy="110" r="64" fill="#F1E6E7" stroke="#BAA0B0" stroke-width="2" /><circle cx="262" cy="98" r="10" fill="#DEB9C5" stroke="#B285A1" stroke-width="1.4" /><path d="M257 96q3-7 7-3t-1 9q-6 3-6-3Z" fill="#8F6A9B" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="287" cy="97" r="10" fill="#DEB9C5" stroke="#B285A1" stroke-width="1.4" /><path d="M282 95q3-7 7-3t-1 9q-6 3-6-3Z" fill="#8F6A9B" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="275" cy="122" r="10" fill="#DEB9C5" stroke="#B285A1" stroke-width="1.4" /><path d="M270 120q3-7 7-3t-1 9q-6 3-6-3Z" fill="#8F6A9B" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M301 112l4 2" fill="none" stroke="#86629B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M251 118l4 2" fill="none" stroke="#86629B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M293 131l4 2" fill="none" stroke="#86629B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M264 138l4 2" fill="none" stroke="#86629B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M279 79l4 2" fill="none" stroke="#86629B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M169 151 208 127" fill="none" stroke="#A0B9AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" /><rect x="68" y="49" width="65" height="78" rx="4" fill="#E8D1DB" stroke="#A88CA1" stroke-width="1.8" /><rect x="65" y="34" width="71" height="21" rx="4" fill="#BD99AC" stroke="#8A6D83" stroke-width="1.7" /><text x="78" y="89" fill="#315C50" font-family="Arial,sans-serif" font-size="11" font-weight="500">Окраска</text><rect x="192" y="203" width="154" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="200" y="218" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Клетки и микроорганизмы</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">03 / 06</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Исследовать содержимое пустулы</text><use href="#cytology" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Листовидная пузырчатка</text></svg>