<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 2. Локализовать воспаление глаза: Увеодерматологический синдром</title><desc id="description">Офтальмолог исследует передний и задний отделы обоих глаз, измеряет внутриглазное давление и оценивает сетчатку. При непрозрачных средах рассматривает УЗИ глаза. Объём процедур выбирает с учётом боли и состояния пациента; обследование сопровождает необходимую помощь, а не откладывает её. Подтверждено либо не подтверждено внутриглазное воспаление, описаны его локализация, двусторонность и осложнения; получена отправная точка для последующего контроля функции глаза.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="eye" viewBox="0 0 400 260"><title>Осмотр глаз офтальмоскопом</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(123 77) scale(0.93)"><path d="M-40 91 C-49 67-47 36-23 18 C-6-1 34 0 49 25 C65 44 68 72 58 94 L44 129 H-16Z" fill="#EACFA7" stroke="#A68157" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-28 22 C-56 14-62 37-58 66 C-55 85-35 88-26 67Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M38 18 C60 18 73 34 69 61 C68 77 55 80 48 65Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 57 C-25 57-26 80-10 89 C9 96 37 91 41 72 C40 58 26 53 14 55Z" fill="#F3DEBB" stroke="#A68157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 63 Q10 57 20 63 L13 72 H6Z" fill="#315C50" stroke="#315C50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-13" cy="44" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><circle cx="34" cy="43" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><path d="M10 72 V80 M-1 81 Q10 88 22 80" fill="none" stroke="#315C50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-24 103 Q7 115 43 102" fill="none" stroke="#C6A477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(263 147) rotate(32) scale(0.7)"><path d="M-35 41 -18 18 C-20 5-14-8-7-6 L-4 11 C2 1 5-13 11-10 L14 8 C19-2 24-9 29-5 L27 14 C37 10 41 15 37 22 L19 49Z" fill="#DDE7DF" stroke="#8DADA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-33 40 -47 62 -10 80 20 48" fill="#B7CFD9" stroke="#83A6B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M231 95H266V137H239Z" fill="#7EA792" stroke="#315C50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="239" y="131" width="19" height="53" rx="6" fill="#B7CFD9" stroke="#315C50" stroke-width="2" /><circle cx="247" cy="110" r="10" fill="#DAE3C8" stroke="#315C50" stroke-width="2" /><circle cx="247" cy="110" r="4" fill="#315C50" stroke="none" stroke-width="2" /><path d="M155 117 231 110" fill="none" stroke="#DFC96F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".4" /><circle cx="155" cy="117" r="13" fill="none" stroke="#E2CB77" stroke-width="2" /><rect x="212" y="221" width="166" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="220" y="236" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Офтальмологический осмотр</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">02 / 06</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Локализовать воспаление глаза</text><use href="#eye" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Увеодерматологический синдром</text></svg>