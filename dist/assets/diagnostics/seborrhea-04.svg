<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 4. Обосновать вторичную причину: Себорея</title><desc id="description">Сопоставить оставшийся зуд с аллергическим алгоритмом после базовых исключений. При системных признаках выбрать общий анализ крови, биохимию, мочу и конкретные гормональные исследования. Новое шелушение у пожилого пациента оценивать шире, включая другие воспалительные и опухолевые процессы. Получены аргументы за основное заболевание или список ещё вероятных причин; отмечено, объясняет ли оно распределение и длительность изменений кожи пациента.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="blood" viewBox="0 0 400 260"><title>Лабораторное исследование крови</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(93 104) scale(1)"><path d="M0 0 H24 V79 Q12 98 0 79Z" fill="#F1F7F0" stroke="#86A596" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M2 45 H22 V77 Q12 91 2 77Z" fill="#B77163" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-2" y="-7" width="28" height="17" rx="3" fill="#9A8AA4" stroke="#315C50" stroke-width="1.5" /><rect x="3" y="18" width="18" height="21" rx="2" fill="#FFFDF5" stroke="none" stroke-width="2" /><path d="M6 23H18 M6 29H15" fill="none" stroke="#AAB6A8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(143 104) scale(1)"><path d="M0 0 H24 V79 Q12 98 0 79Z" fill="#F1F7F0" stroke="#86A596" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M2 45 H22 V77 Q12 91 2 77Z" fill="#DBBE69" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-2" y="-7" width="28" height="17" rx="3" fill="#7EA792" stroke="#315C50" stroke-width="1.5" /><rect x="3" y="18" width="18" height="21" rx="2" fill="#FFFDF5" stroke="none" stroke-width="2" /><path d="M6 23H18 M6 29H15" fill="none" stroke="#AAB6A8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(193 104) scale(1)"><path d="M0 0 H24 V79 Q12 98 0 79Z" fill="#F1F7F0" stroke="#86A596" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M2 45 H22 V77 Q12 91 2 77Z" fill="#C9836A" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-2" y="-7" width="28" height="17" rx="3" fill="#B7CFD9" stroke="#315C50" stroke-width="1.5" /><rect x="3" y="18" width="18" height="21" rx="2" fill="#FFFDF5" stroke="none" stroke-width="2" /><path d="M6 23H18 M6 29H15" fill="none" stroke="#AAB6A8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="73" y="160" width="148" height="26" rx="6" fill="#D6E3D7" stroke="#92AB97" stroke-width="2" /><path d="M84 186V215 M210 186V215" fill="none" stroke="#92AB97" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(265 63) scale(0.65)"><rect x="0" y="0" width="116" height="154" rx="9" fill="#FEFDF8" stroke="#AABCB0" stroke-width="2" /><rect x="34" y="-6" width="48" height="17" rx="5" fill="#7EA792" stroke="#315C50" stroke-width="2" /><circle cx="58" cy="-2" r="3" fill="#FAF8F0" stroke="none" stroke-width="2" /><path d="M20 38H93 M20 67H93 M20 96H93 M20 125H93" fill="none" stroke="#C4D2C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="m19 29 4 4 8-9 m-12 34 4 4 8-9 m-12 34 4 4 8-9" fill="none" stroke="#7EA792" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="66" y="225" width="94" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="74" y="240" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Образцы крови</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">04 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Обосновать вторичную причину</text><use href="#blood" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Себорея</text></svg>