<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 4. Уточнить гипофизарный или надпочечниковый источник: Гиперадренокортицизм</title><desc id="description">После обоснования гормонального синдрома оценить надпочечники на УЗИ и при необходимости эндогенный АКТГ. Отдельным пациентам требуется визуализация гипофиза или дополнительное исследование. Метод выбирают по клинической задаче и тому, повлияет ли ответ на лечение. Сопоставлены гормональные и анатомические данные; происхождение синдрома становится вероятнее, либо остаётся неопределённым с понятной необходимостью дополнительной диагностики у специалиста.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="ultrasound" viewBox="0 0 400 260"><title>Ультразвуковое исследование животного</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><path d="M49 168 Q68 133 130 148 L189 159 190 203H63Z" fill="#EACFA7" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(63 120) scale(0.51)"><path d="M-40 91 C-49 67-47 36-23 18 C-6-1 34 0 49 25 C65 44 68 72 58 94 L44 129 H-16Z" fill="#EACFA7" stroke="#A68157" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-28 22 C-56 14-62 37-58 66 C-55 85-35 88-26 67Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M38 18 C60 18 73 34 69 61 C68 77 55 80 48 65Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 57 C-25 57-26 80-10 89 C9 96 37 91 41 72 C40 58 26 53 14 55Z" fill="#F3DEBB" stroke="#A68157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 63 Q10 57 20 63 L13 72 H6Z" fill="#315C50" stroke="#315C50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-13" cy="44" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><circle cx="34" cy="43" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><path d="M10 72 V80 M-1 81 Q10 88 22 80" fill="none" stroke="#315C50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-24 103 Q7 115 43 102" fill="none" stroke="#C6A477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="220" y="55" width="135" height="101" rx="8" fill="#B8CCBD" stroke="#315C50" stroke-width="2.4" /><rect x="227" y="62" width="121" height="80" rx="4" fill="#345D53" stroke="none" stroke-width="2" /><path d="M287.5 156V185 M260.5 185H314.5" fill="none" stroke="#315C50" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M242 87 Q276 67 328 88 L306 132 Q276 149 257 132Z" fill="#9BAE9B" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M256 102 Q280 86 315 103 M263 115Q283 104 309 116" fill="none" stroke="#D4DDC9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(183 112) rotate(-25) scale(0.57)"><path d="M-35 41 -18 18 C-20 5-14-8-7-6 L-4 11 C2 1 5-13 11-10 L14 8 C19-2 24-9 29-5 L27 14 C37 10 41 15 37 22 L19 49Z" fill="#DDE7DF" stroke="#8DADA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-33 40 -47 62 -10 80 20 48" fill="#B7CFD9" stroke="#83A6B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M172 156 188 166" fill="none" stroke="#315C50" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M188 160 C217 155 201 105 221 100" fill="none" stroke="#879F8D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="51" y="225" width="178" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="59" y="240" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Ультразвуковое исследование</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">04 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Уточнить гипофизарный или надпочечниковый</text><text x="27" y="87" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">источник</text><use href="#ultrasound" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Гиперадренокортицизм</text></svg>