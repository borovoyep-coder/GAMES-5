<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 5. Сравнить динамику после ограничения экспозиции: Актинический дерматит</title><desc id="description">На контрольном осмотре врач сравнивает фотографии, площадь эритемы, корки и язвы после согласованных мер уменьшения солнечного воздействия и ведения выявленных осложнений. Отдельно осматривает новые узлы и стойкие участки. Снижение красноты не использует как доказательство исчезновения всех клеточных изменений. Документированы регресс, стабильность либо прогрессирование отдельных очагов; выделены участки, требующие повторной биопсии или пересмотра первоначального клинического объяснения поражений пациента.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="monitor" viewBox="0 0 400 260"><title>Контроль изменений на повторном приёме</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(56 48) scale(0.98)"><rect x="0" y="0" width="116" height="154" rx="9" fill="#FEFDF8" stroke="#AABCB0" stroke-width="2" /><rect x="34" y="-6" width="48" height="17" rx="5" fill="#7EA792" stroke="#315C50" stroke-width="2" /><circle cx="58" cy="-2" r="3" fill="#FAF8F0" stroke="none" stroke-width="2" /><path d="M20 38H93 M20 67H93 M20 96H93 M20 125H93" fill="none" stroke="#C4D2C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="m19 29 4 4 8-9 m-12 34 4 4 8-9 m-12 34 4 4 8-9" fill="none" stroke="#7EA792" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(284 110) scale(0.68)"><path d="M-40 91 C-49 67-47 36-23 18 C-6-1 34 0 49 25 C65 44 68 72 58 94 L44 129 H-16Z" fill="#EACFA7" stroke="#A68157" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-28 22 C-56 14-62 37-58 66 C-55 85-35 88-26 67Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M38 18 C60 18 73 34 69 61 C68 77 55 80 48 65Z" fill="#BD9767" stroke="#A68157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 57 C-25 57-26 80-10 89 C9 96 37 91 41 72 C40 58 26 53 14 55Z" fill="#F3DEBB" stroke="#A68157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 63 Q10 57 20 63 L13 72 H6Z" fill="#315C50" stroke="#315C50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-13" cy="44" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><circle cx="34" cy="43" r="3.5" fill="#315C50" stroke="none" stroke-width="2" /><path d="M10 72 V80 M-1 81 Q10 88 22 80" fill="none" stroke="#315C50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-24 103 Q7 115 43 102" fill="none" stroke="#C6A477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="214" y="46" width="129" height="66" rx="6" fill="#F8FAEF" stroke="#ADC0AA" stroke-width="1.6" /><path d="M228 61V99H330 M234 79 254 91 277 78 301 69 322 68" fill="none" stroke="#7EA792" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="234" cy="79" r="3" fill="#7EA792" stroke="none" stroke-width="2" /><circle cx="254" cy="91" r="3" fill="#7EA792" stroke="none" stroke-width="2" /><circle cx="277" cy="78" r="3" fill="#7EA792" stroke="none" stroke-width="2" /><circle cx="301" cy="69" r="3" fill="#7EA792" stroke="none" stroke-width="2" /><circle cx="322" cy="68" r="3" fill="#7EA792" stroke="none" stroke-width="2" /><rect x="54" y="225" width="178" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="62" y="240" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Динамика и контроль лечения</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">05 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Сравнить динамику после ограничения экспозиции</text><use href="#monitor" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Актинический дерматит</text></svg>