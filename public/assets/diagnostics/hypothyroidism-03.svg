<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 3. Использовать общий T4 как ориентир: Гипотиреоз</title><desc id="description">Определить общий T4 в лаборатории с подходящим методом и референсами. Сопоставить результат с породой, возрастом, болезнями и лекарствами. Сохранить дату отбора и сведения о ранее полученном левотироксине: анализ на фоне препарата отвечает на другой вопрос. Получен скрининговый показатель: низкое значение оставляет несколько объяснений, тогда как убедительно нормальное значение обычно делает гипотиреоз менее вероятным.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="hormone" viewBox="0 0 400 260"><title>Оценка гормонов и динамической пробы</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(57 106) scale(0.92)"><path d="M0 0 H24 V79 Q12 98 0 79Z" fill="#F1F7F0" stroke="#86A596" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M2 45 H22 V77 Q12 91 2 77Z" fill="#DABF70" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-2" y="-7" width="28" height="17" rx="3" fill="#A390B1" stroke="#315C50" stroke-width="1.5" /><rect x="3" y="18" width="18" height="21" rx="2" fill="#FFFDF5" stroke="none" stroke-width="2" /><path d="M6 23H18 M6 29H15" fill="none" stroke="#AAB6A8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(98 106) scale(0.92)"><path d="M0 0 H24 V79 Q12 98 0 79Z" fill="#F1F7F0" stroke="#86A596" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M2 45 H22 V77 Q12 91 2 77Z" fill="#DABF70" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-2" y="-7" width="28" height="17" rx="3" fill="#A390B1" stroke="#315C50" stroke-width="1.5" /><rect x="3" y="18" width="18" height="21" rx="2" fill="#FFFDF5" stroke="none" stroke-width="2" /><path d="M6 23H18 M6 29H15" fill="none" stroke="#AAB6A8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="168" y="52" width="178" height="139" rx="9" fill="#FEFDF8" stroke="#A8BCA9" stroke-width="2" /><path d="M190 76V169H325" fill="none" stroke="#8FA793" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M202 101 Q221 150 250 149 T311 116" fill="none" stroke="#7EA792" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="202" cy="101" r="4.5" fill="#FAF8F0" stroke="#7EA792" stroke-width="2" /><circle cx="250" cy="149" r="4.5" fill="#FAF8F0" stroke="#7EA792" stroke-width="2" /><circle cx="311" cy="116" r="4.5" fill="#FAF8F0" stroke="#7EA792" stroke-width="2" /><text x="192" y="185" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">0</text><text x="248" y="185" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">1</text><text x="309" y="185" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">2</text><text x="183" y="39" fill="#315C50" font-family="Arial,sans-serif" font-size="12" font-weight="500">Динамическая проба</text><rect x="48" y="225" width="190" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="56" y="240" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Изменение гормонов во времени</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">03 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Использовать общий T4 как ориентир</text><use href="#hormone" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Гипотиреоз</text></svg>