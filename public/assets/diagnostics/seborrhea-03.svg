<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 3. Исследовать паразитарную и грибковую ветвь: Себорея</title><desc id="description">Выбрать вычёсывание, соскобы и другие методы поиска эктопаразитов по локализации и клинике. При подозрении на дерматофитию исследовать волосы и назначить подходящую грибковую диагностику. Проверить фактическую профилактику паразитов и животных контакта, не ограничиваясь словами «обработан недавно». Выявлена вероятная кожная причина либо получены отрицательные результаты с понятными ограничениями; определено, нужна ли другая проба или повторный отбор.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="scraping" viewBox="0 0 400 260"><title>Соскоб кожи ветеринарным специалистом</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><g transform="translate(42 145)"><path d="M0 0 Q37.800000000000004 -7 75.60000000000001 0 T151.20000000000002 0 L189 0 V53 H0Z" fill="#F2D9C7" stroke="#B28B70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 0 Q37.800000000000004 -7 75.60000000000001 0 T151.20000000000002 0 L189 0 V13 H0Z" fill="#D9A687" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 18 H189" fill="none" stroke="#E4BAA0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M59 145q-8-15-4-30" fill="none" stroke="#A68157" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M72 145q-8-15-4-30" fill="none" stroke="#A68157" strok