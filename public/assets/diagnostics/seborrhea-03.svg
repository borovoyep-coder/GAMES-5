 d="M149 138 170 143" fill="none" stroke="#8B9F94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(244 172) rotate(-9)"><rect x="0" y="0" width="113" height="39" rx="3" fill="#E6F0EC" stroke="#8DAFA1" stroke-width="2" /><rect x="1" y="1" width="27" height="37" rx="2" fill="#F9F8F0" stroke="none" stroke-width="2" /><path d="M7 9H20 M7 16H20" fill="none" stroke="#C2CBBB" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="65" cy="20" r="9" fill="#D9B5BB" stroke="none" stroke-width="2" /><circle cx="79" cy="22" r="5" fill="#E1C8CD" stroke="none" stroke-width="2" /></g><path d="M238 144 Q257 136 268 154" fill="none" stroke="#A3B8A7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" /><rect x="42" y="222" width="154" height="22" rx="11" fill="#DCE8DD" stroke="none" stroke-width="2" /><text x="50" y="237" fill="#315C50" font-family="Arial,sans-serif" font-size="10" font-weight="500">Образец для микроскопии</text></g></symbol></defs><rect width="640" height="420" rx="18" fill="#f7f8ef"/><path d="M25 350H615" stroke="#dce5d0"/><text x="27" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#819270">АТЛАС ДИАГНОСТИКИ</text><text x="560" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#617b50">03 / 05</text><text x="27" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3c5b36">Исследовать паразитарную и грибковую ветвь</text><use href="#scraping" x="54" y="90" width="532" height="250"/><text x="27" y="377" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#667e57">Себорея</text></svg>