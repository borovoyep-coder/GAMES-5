<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description"><title id="title">Этап 3. Описать поражения и проверить органы: Кожные васкулиты</title><desc id="description">Врач картирует пурпуру, отёки, язвы и некроз, осматривает уши, хвост, лапы и слизистые. Назначает общий анализ крови с тромбоцитами, биохимию и анализ мочи. Если выявлены протеинурия, изменения осадка или почечных показателей, то уточняет их происхождение дополнительными исследованиями. Сформированы карта кожных поражений и исходный системный профиль; выявлены либо не выявлены признаки тромбоцитарных, почечных или других сопутствующих нарушений.</desc><defs><symbol xmlns="http://www.w3.org/2000/svg" id="urine" viewBox="0 0 400 260"><title>Образец мочи, тестовая полоска и осадок</title><rect x="0" y="0" width="400" height="260" rx="20" fill="#FAF8F0" /><path d="M0 185 Q180 165 400 185 V260 H0Z" fill="#EDF1E7" /><ellipse cx="204" cy="223" rx="148" ry="13" fill="#CFDCCD" opacity=".55" /><g fill="none" stroke="#BDD0BC" stroke-width="1.6" opacity=".6"><path d="M361 183 C359 148 365 115 377 94" /><path d="M365 143 C339 139 344 121 365 137 M368 126 C387 124 388 109 372 116 M361 163 C339 158 341 145 361 153" /></g><g><path d="M82 94 H171 L164 208 Q126 218 88 208Z" fill="#ECF2E8" stroke="#8BA792" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M87 150 H168 L164 208 Q126 217 90 208Z" fill="#E7D68D" stroke="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="77" y="79" width="99" height="22" rx="5" fill="#7EA792" stroke="#315C50" stroke-width="2" /><rect x="98" y="119" width="57" height="31" rx="3" fill="#FAF8F0" stroke="none" stroke-width="2" /><text x="107" y="139" fill="#315C50" font-family="Arial,sans-serif" font-size="12" font-weight="500">Проба</text><rect x="224" y="72" width="16" height="135" rx="2" fill="#FEFCF4" stroke="#B6BFAA" stroke-width="1.4" /><rect x="226" y="9